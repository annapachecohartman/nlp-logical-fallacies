<div class="initial-container">
  <div class="chat-container">
    <form
      id="analysis-form"
      hx-post="/analyze"
      hx-target="#content-area"
      hx-swap="innerHTML"
    >
      <div class="input-container">
        <textarea
          name="userArgument"
          class="chat-input"
          placeholder="Enter your argument or statement here..."
          required
        >{{initial_text}}</textarea>

        <select name="model" class="dropdown-select" required>
          <option value="" disabled selected>Select model</option>
          <option value="qlora-finetuned-tinyllama">qlora-finetuned-tinyllama</option>
          <option value="bert-fallacy-detector">bert-fallacy-detector</option>
          <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        </select>

        <button type="submit" class="submit-button">&#10132;</button>
      </div>
    </form>
  </div>
</div>
